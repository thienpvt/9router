# Branch-only image build: pushes to self-developed produce a
# ghcr.io/<owner>/9router:self-developed image for manual pull/deploy.
name: Build & Push self-developed image

on:
  push:
    branches: [self-developed]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: docker-self-developed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false

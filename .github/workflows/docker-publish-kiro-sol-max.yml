# Branch-only image build: pushes to kiro-sol-max produce a
# ghcr.io/<owner>/9router:kiro-sol-max image for manual pull/deploy.
name: Build & Push kiro-sol-max image

on:
  push:
    branches: [kiro-sol-max]
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  TAG: kiro-sol-max

concurrency:
  group: docker-kiro-sol-max-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ env.TAG }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          # amd64 only: Dockerfile bases thienpvt/node-router:builder/:runner are
          # single-arch amd64, so an arm64 platform cannot be resolved.
          platforms: linux/amd64
          provenance: false
          sbom: false
